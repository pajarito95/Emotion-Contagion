mode: grid

output:
  output_root: null
  output_subdir: outputs
  create_subfolders: true
  add_timestamp_to_output_dir: true
  separate_condition_folders: true
  separate_run_folders: false
  save_full_results: true
  save_run_metadata: true
  save_summary: true
  summary_filename: summary.csv
  results_filename_template: simulation_result_run_{run_id}.pkl
  metadata_filename_template: simulation_result_run_{run_id}_metadata.json
  make_sentiment_plots: false

seed_spec:
  start: 0
  n_repetitions: 20

single_condition:
  condition_name: demo_random
  population_size: 11
  structure: random
  leader_style: High_Initially_Constrained
  max_iterations: 235
  min_weight: 0.01
  include_leader_ties: true
  leader_to_member_cap: null
  member_to_leader_cap: null
  leader_to_member_value: null
  member_to_leader_value: null
  strength: 0.5
  n_communities: null
  intra_strength: null
  inter_strength: null
  n_periphery: null
  core_to_periph: null
  periph_to_core: null
  periph_to_periph: null
  adaptive_intimacy: false
  kappa: null
  decay: null
  min_w: null
  max_w: null
  dampening: 0.08

manual_conditions:
  - condition_name: community_high
    population_size: 11
    structure: community
    leader_style: High_Initially_Constrained
    max_iterations: 235
    min_weight: 0.01
    include_leader_ties: true
    leader_to_member_cap: null
    member_to_leader_cap: null
    leader_to_member_value: null
    member_to_leader_value: null
    strength: null
    n_communities: 2
    intra_strength: 0.5
    inter_strength: 0.2
    n_periphery: null
    core_to_periph: null
    periph_to_core: null
    periph_to_periph: null
    adaptive_intimacy: false
    kappa: null
    decay: null
    min_w: null
    max_w: null
    dampening: 0.08

  - condition_name: random_none
    population_size: 11
    structure: random
    leader_style: No_Intervention
    max_iterations: 235
    min_weight: 0.01
    include_leader_ties: true
    leader_to_member_cap: null
    member_to_leader_cap: null
    leader_to_member_value: null
    member_to_leader_value: null
    strength: 0.5
    n_communities: null
    intra_strength: null
    inter_strength: null
    n_periphery: null
    core_to_periph: null
    periph_to_core: null
    periph_to_periph: null
    adaptive_intimacy: false
    kappa: null
    decay: null
    min_w: null
    max_w: null
    dampening: 0.08

  - condition_name: core_periphery_low
    population_size: 11
    structure: core_periphery
    leader_style: Low_Initially_Constrained
    max_iterations: 235
    min_weight: 0.01
    include_leader_ties: true
    leader_to_member_cap: null
    member_to_leader_cap: null
    leader_to_member_value: null
    member_to_leader_value: null
    strength: null
    n_communities: null
    intra_strength: null
    inter_strength: null
    n_periphery: 10
    core_to_periph: 0.5
    periph_to_core: 0.2
    periph_to_periph: 0.2
    adaptive_intimacy: false
    kappa: null
    decay: null
    min_w: null
    max_w: null
    dampening: 0.08

grid:
  condition_name_keys: [structure, leader_style]
  fixed_params:
    population_size: 11
    max_iterations: 235
    min_weight: 0.01
    include_leader_ties: true
    leader_to_member_cap: null
    member_to_leader_cap: null
    leader_to_member_value: null
    member_to_leader_value: null
    adaptive_intimacy: false
    kappa: null
    decay: null
    min_w: null
    max_w: null
    dampening: 0.08

    # random
    strength: 0.5

    # community
    n_communities: 2
    intra_strength: 0.5
    inter_strength: 0.2

    # core-periphery
    n_periphery: 10
    core_to_periph: 0.5
    periph_to_core: 0.2
    periph_to_periph: 0.2

  condition_grid:
    structure: [random, community, core_periphery]
    leader_style: [No_Intervention, High_Initially_Constrained, Low_Initially_Constrained]