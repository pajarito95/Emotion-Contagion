mode: grid

output:
  output_root: null
  output_subdir: outputs
  create_subfolders: true
  add_timestamp_to_output_dir: true
  separate_condition_folders: true
  separate_run_folders: false
  save_full_results: true
  save_run_metadata: true
  save_summary: true
  summary_filename: summary.csv
  results_filename_template: simulation_result_run_{run_id}.pkl
  metadata_filename_template: simulation_result_run_{run_id}_metadata.json
  make_sentiment_plots: false

seed_spec:
  start: 0
  n_repetitions: 20

# ============================================================
# RL DEFAULTS
rl:
  use_rl: true

  actions: [0, 1, 2, 3]

  q_learning:
    alpha: 0.1
    gamma: 0.95

    epsilon_start: 0.3
    epsilon_end: 0.05
    epsilon_decay_steps: 2000

  state_bins:
    n_bins_mean: 5
    n_bins_var: 4
    n_bins_homo: 4

  state_ranges:
    mean_min: -1.0
    mean_max: 1.0

    var_min: 0.0
    var_max: 1.0

    homo_min: 0.0
    homo_max: 0.05

# ============================================================
# SINGLE CONDITION
single_condition:
  condition_name: demo_random

  population_size: 11
  structure: random

  leader_style: High_Initially_Constrained

  max_iterations: 235

  min_weight: 0.01

  include_leader_ties: true

  leader_to_member_cap: null
  member_to_leader_cap: null

  leader_to_member_value: null
  member_to_leader_value: null

  # random
  strength: 0.5

  # community
  n_communities: null
  intra_strength: null
  inter_strength: null

  # core-periphery
  n_periphery: null
  core_to_periph: null
  periph_to_core: null
  periph_to_periph: null

  # adaptive intimacy
  adaptive_intimacy: false
  kappa: 0.08
  decay: 0.01 
  min_w: 0.002
  max_w: 1.0

  # leader intervention
  dampening: 0.08

  # RL
  use_rl: true

# ============================================================
# MANUAL CONDITIONS
manual_conditions:

  - condition_name: community_high

    population_size: 11
    structure: community
    leader_style: High_Initially_Constrained

    max_iterations: 235

    min_weight: 0.01

    include_leader_ties: true

    leader_to_member_cap: null
    member_to_leader_cap: null

    leader_to_member_value: null
    member_to_leader_value: null

    # random
    strength: null

    # community
    n_communities: 2
    intra_strength: 0.5
    inter_strength: 0.2

    # core-periphery
    n_periphery: null
    core_to_periph: null
    periph_to_core: null
    periph_to_periph: null

    # adaptive intimacy
    adaptive_intimacy: false
    kappa: 0.08
    decay: 0.01 
    min_w: 0.002
    min_w: 1.0
  
    # leader intervention
    dampening: 0.08

    # RL
    use_rl: true

  - condition_name: random_none

    population_size: 11
    structure: random
    leader_style: No_Intervention

    max_iterations: 235

    min_weight: 0.01

    include_leader_ties: true

    leader_to_member_cap: null
    member_to_leader_cap: null

    leader_to_member_value: null
    member_to_leader_value: null

    # random
    strength: 0.5

    # community
    n_communities: null
    intra_strength: null
    inter_strength: null

    # core-periphery
    n_periphery: null
    core_to_periph: null
    periph_to_core: null
    periph_to_periph: null

    # adaptive intimacy
    adaptive_intimacy: false
    kappa: 0.08
    decay: 0.01 
    min_w: 0.002
    min_w: 1.0

    # leader intervention
    dampening: 0.08

    # RL
    use_rl: false

  - condition_name: core_periphery_low

    population_size: 11
    structure: core_periphery
    leader_style: Low_Initially_Constrained

    max_iterations: 235

    min_weight: 0.01

    include_leader_ties: true

    leader_to_member_cap: null
    member_to_leader_cap: null

    leader_to_member_value: null
    member_to_leader_value: null

    # random
    strength: null

    # community
    n_communities: null
    intra_strength: null
    inter_strength: null

    # core-periphery
    n_periphery: 10
    core_to_periph: 0.5
    periph_to_core: 0.2
    periph_to_periph: 0.2

    # adaptive intimacy
    adaptive_intimacy: false
    kappa: 0.08
    decay: 0.01 
    min_w: 0.002
    min_w: 1.0

    # leader intervention
    dampening: 0.08

    # RL
    use_rl: true

# ============================================================
# GRID CONDITIONS
grid:

  condition_name_keys:
    - structure
    - leader_style

  fixed_params:

    population_size: 11

    max_iterations: 235

    min_weight: 0.01

    include_leader_ties: true

    leader_to_member_cap: null
    member_to_leader_cap: null

    leader_to_member_value: null
    member_to_leader_value: null

    # adaptive intimacy
    adaptive_intimacy: true
    kappa: 0.08
    decay: 0.01
    min_w: 0.01
    max_w: 1.0

    # leader intervention
    dampening: 0.08

    # RL
    use_rl: true

    # random
    strength: 0.5

    # community
    n_communities: 2
    intra_strength: 0.5
    inter_strength: 0.2

    # core-periphery
    n_periphery: 10
    core_to_periph: 0.5
    periph_to_core: 0.2
    periph_to_periph: 0.2

  condition_grid:

    structure:
      - random
      - community
      - core_periphery

    leader_style:
      - No_Intervention
      - High_Fully_Constrained
      - Low_Fully_Constrained
      - High_Initially_Constrained
      - Low_Initially_Constrained
      - Free