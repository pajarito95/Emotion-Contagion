mode: grid

output:
  output_root: null
  output_subdir: outputs
  create_subfolders: true
  add_timestamp_to_output_dir: true
  separate_condition_folders: true
  separate_run_folders: false
  save_full_results: true
  save_run_metadata: true
  save_summary: true
  summary_filename: summary.csv
  results_filename_template: simulation_result_run_{run_id}.pkl
  metadata_filename_template: simulation_result_run_{run_id}_metadata.json
  make_sentiment_plots: true

seeds: [1, 2, 3]

single_condition:
  condition_name: demo_single_condition
  population_size: 11
  structure: community
  leader_style: High_Initially_Constrained
  max_iterations: 50
  intra_strength: 0.5
  inter_strength: 0.2
  community_size: null
  min_weight: 0.01
  core_to_core: 0.65
  core_to_periph: 0.5
  periph_to_core: 0.2
  periph_to_periph: 0.2
  core_proportion: 0.25
  include_leader_ties: true
  leader_to_member_cap: null
  member_to_leader_cap: null
  leader_to_member_value: null
  member_to_leader_value: null
  adaptive_intimacy: false
  kappa: null
  decay: null
  min_w: null
  max_w: null
  dampening: 0.08

manual_conditions:
  - condition_name: community_high
    population_size: 11
    structure: community
    leader_style: High_Initially_Constrained
    max_iterations: 50
    adaptive_intimacy: false
  - condition_name: random_none
    population_size: 11
    structure: random
    leader_style: No_Intervention
    max_iterations: 50
    adaptive_intimacy: false

grid:
  condition_name_keys: [structure, leader_style]
  fixed_params:
    population_size: 11
    max_iterations: 50
    adaptive_intimacy: false
    intra_strength: 0.5
    inter_strength: 0.2
    include_leader_ties: true
    dampening: 0.08
  condition_grid:
    structure: [community, random, core_periphery]
    leader_style: [No_Intervention, High_Initially_Constrained, Low_Initially_Constrained]
